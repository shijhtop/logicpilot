name: ci

on:
  push:
  pull_request:

jobs:
  tests:
    name: Tests (${{ matrix.os }}, Python ${{ matrix.python-version }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
        python-version: ["3.10", "3.11", "3.12"]

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install pytest
        run: python -m pip install pytest

      - name: Run tests
        run: python -m pytest tests -q

  package-check:
    name: Package structure and syntax
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: No generated files
        run: |
          set -euo pipefail
          junk="$(find . \
            -name '__pycache__' -o \
            -name '*.pyc' -o \
            -name '.pytest_cache' -o \
            -name '.DS_Store' -o \
            -name 'node_modules' -o \
            -name '.venv' -o \
            -name 'venv' \
          )"
          test -z "$junk" || { echo "$junk"; exit 1; }

      - name: Python syntax
        run: python -m compileall -q codex/skills tests

      - name: Codex package contract
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          root = Path.cwd()
          plugin = root / "codex"
          manifest = json.loads(
              (plugin / ".codex-plugin" / "plugin.json").read_text()
          )
          marketplace = json.loads(
              (root / ".agents" / "plugins" / "marketplace.json").read_text()
          )
          skills = sorted((plugin / "skills").glob("*/SKILL.md"))
          if len(skills) != 5:
              raise SystemExit(f"expected 5 skills, found {len(skills)}")
          if (plugin / "flow").exists() or (plugin / "AGENTS.md").exists():
              raise SystemExit("plugin must remain skills-first")
          if any((skill.parent / "scripts").exists() for skill in skills):
              raise SystemExit("plugin skills must not bundle heuristic HDL scanners")
          entries = [
              entry for entry in marketplace["plugins"]
              if entry["name"] == manifest["name"]
          ]
          if len(entries) != 1:
              raise SystemExit("marketplace must contain exactly one manifest entry")
          source = entries[0]["source"]
          if source["source"] != "local":
              raise SystemExit("marketplace source must be local")
          if (root / source["path"]).resolve() != plugin.resolve():
              raise SystemExit("marketplace source path does not resolve to plugin")
          for skill in skills:
              lines = skill.read_text().splitlines()
              if len(lines) < 5 or lines[0] != "---" or lines[1] != f"name: {skill.parent.name}":
                  raise SystemExit(f"invalid skill frontmatter: {skill}")
              if not (skill.parent / "agents" / "openai.yaml").is_file():
                  raise SystemExit(f"missing Codex metadata: {skill.parent}")
          prompts = manifest["interface"].get("defaultPrompt")
          if not isinstance(prompts, list) or not 1 <= len(prompts) <= 3:
              raise SystemExit("manifest requires 1-3 default prompts")
          for prompt in prompts:
              if not isinstance(prompt, str) or not 0 < len(prompt) <= 128:
                  raise SystemExit("invalid default prompt")
          PY
